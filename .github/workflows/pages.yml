name: Deploy ICC Le Mans
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load application modules
        run: |
          for script in platform-2026.js people-2026.js mentorship-2026.js programs-2026.js notifications-2026.js governance-2026.js navigation.js; do
            if ! grep -q "src=\"$script\"" public/index.html; then
              sed -i "s#</body>#<script src=\"$script\"></script></body>#" public/index.html
            fi
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Clear stale Pages deployment and wait
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_DEPLOYMENT: f816fa2dc54955743b88b11f53a9c01849369c17
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{ github.repository }}/pages/deployments/$STALE_DEPLOYMENT"
          code=$(curl -sS -o /tmp/cancel.out -w "%{http_code}" -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" "$api/cancel" || true)
          echo "Cancel request HTTP $code"
          cat /tmp/cancel.out || true
          if [ "$code" != "204" ] && [ "$code" != "404" ]; then exit 1; fi
          for i in $(seq 1 30); do
            status_code=$(curl -sS -o /tmp/status.json -w "%{http_code}" -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" "$api" || true)
            if [ "$status_code" = "404" ]; then echo "Stale deployment cleared"; break; fi
            status=$(python -c "import json; print(json.load(open('/tmp/status.json')).get('status',''))" 2>/dev/null || true)
            echo "Stale deployment status: ${status:-unknown}"
            case "$status" in in_progress|queued|pending|updating_pages|deployment_in_progress|'') sleep 2 ;; *) break ;; esac
          done
          sleep 3
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
