name: Deploy ICC Le Mans
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load access workspaces and organization enhancements
        run: |
          if ! grep -q 'fi-access.js' public/index.html; then
            sed -i 's#</body>#<script src="fi-access.js"></script></body>#' public/index.html
          fi
          if ! grep -q 'org-v2.js' public/index.html; then
            sed -i 's#</body>#<script src="org-v2.js"></script></body>#' public/index.html
          fi
          if ! grep -q 'settings-access.js' public/index.html; then
            sed -i 's#</body>#<script src="settings-access.js"></script></body>#' public/index.html
          fi
          if ! grep -q 'operational-modules.js' public/index.html; then
            sed -i 's#</body>#<script src="operational-modules.js"></script></body>#' public/index.html
          fi
          if ! grep -q 'member-fix.js' public/index.html; then
            sed -i 's#</body>#<script src="member-fix.js"></script></body>#' public/index.html
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
