name: Deploy ICC Le Mans
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load access workspaces and organization enhancements
        run: |
          for script in fi-access.js org-v2.js settings-access.js operational-modules.js member-fix.js settings-smart.js unit-workspace.js com-training.js jkids.js member-relations.js attendance-family.js attendance-advanced.js attendance-pilotage.js org-flex.js member-discovery.js integration-discovery.js office-governance.js office-workspace.js member-ux.js pilotage-v3.js integration-workspace-v3.js fi-pilotage-v3.js office-v4.js office-v5.js program-pilotage-v5.js archive-pilotage-v5.js metric-navigation-v5.js; do
            if ! grep -q "$script" public/index.html; then
              sed -i "s#</body>#<script src=\"$script\"></script></body>#" public/index.html
            fi
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
