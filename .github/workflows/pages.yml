name: Deploy ICC Le Mans
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load consolidated modular platform
        run: |
          for script in platform-2026.js people-2026.js programs-2026.js notifications-2026.js governance-2026.js router-2026.js; do
            if ! grep -q "$script" public/index.html; then
              sed -i "s#</body>#<script src=\"$script\"></script></body>#" public/index.html
            fi
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
